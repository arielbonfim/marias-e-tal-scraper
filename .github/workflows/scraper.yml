name: Automação do Catálogo

on:
  schedule:
    # -------------------------------------------------------------------
    # Horário de Brasília (BRT / UTC-3):
    # - De 1h em 1h entre 10:00 e 22:00 BRT
    # - Atualizações extras às 00:00 BRT e 08:30 BRT
    # -------------------------------------------------------------------
    
    # 10:00 às 20:00 BRT (13:00 às 23:00 UTC)
    - cron: '0 13-23 * * *'
    
    # 21:00 e 22:00 BRT (00:00 e 01:00 UTC)
    - cron: '0 0,1 * * *'
    
    # 00:00 BRT / Meia-noite (03:00 UTC)
    - cron: '0 3 * * *'
    
    # 08:30 BRT (11:30 UTC)
    - cron: '30 11 * * *'

  workflow_dispatch: # Permite execução manual pelo painel do GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permissão para commitar o CSV e o JSON de estado de volta no repositório

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Navegador Chromium do Playwright
        run: |
          playwright install --with-deps chromium

      - name: Executar Scraper
        run: |
          python main.py

      - name: Fazer Commit e Push das Alterações (CSV + Estado JSON)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.csv produtos_conhecidos.json
          
          # Garante o commit apenas se houver mudanças reais
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: atualiza catálogo e histórico [skip ci]"
          git push
